<div class="container mt-5">
  <h1 class="text-center">Country Flags</h1>
  <div class="col-md-8 m-auto">
    <div class="form-group mt-2">
      <!-- <form> -->
      <select class="form-control" (change)="selectCountry($event)">
        <option [value]="" disabled selected>Select Country</option>
        @for (country of countries(); track country) {
        <option [value]="country.name.official">
          {{ country.name.official }}
        </option>
        }
      </select>
      <!-- </form> -->
    </div>
  </div>

  @if (selectedCountry) {
  <div class="container card mt-5 shadow-lg p-3 mb-5 bg-white rounded">
    <h1 class="text-center info">
      {{ selectedCountry.name.official }} |
      {{ selectedCountry.capital.join(", ") }} |
      {{ selectedCountry.region }}
    </h1>
    <img [src]="selectedCountry.flags.svg" class="img-fluid" />
  </div>
  }
</div>
